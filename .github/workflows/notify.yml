name: Notify Skill Update

on:
  push:
    branches:
      - main
    paths:
      - ".seenical/**"
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seenical-skill-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      NOTIFY_URL: ${{ vars.NOTIFY_URL }}
    steps:
      - name: Send update notification
        if: ${{ env.NOTIFY_URL != '' }}
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg ref "$REF" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg event_id "$EVENT_ID" \
            '{schema_version:1,repository:$repository,ref:$ref,commit_sha:$commit_sha,event_id:$event_id}')
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 3 --retry-all-errors \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$NOTIFY_URL"
